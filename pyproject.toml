[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "profile-turntaking"
version = "0.1.0"
description = "Profile-conditioned five-class turn-taking prediction MVP"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "MIT"}
authors = [{name = "Profile-aware Turn-taking Research"}]
dependencies = [
  "numpy>=1.26,<3",
  "torch>=2.2,<3",
]

[project.optional-dependencies]
whisper = [
  "transformers>=4.45,<6",
  "safetensors>=0.4",
]
dev = [
  "pytest>=8,<10",
]

[project.scripts]
profile-turntaking = "profile_turntaking.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
