[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "profile-turntaking"
version = "0.1.0"
description = "Profile-aware turn-taking main experiment and Talking Turns comparison"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "MIT"}
authors = [{name = "Profile-aware Turn-taking Research"}]
dependencies = [
  "numpy>=1.26,<3",
  "torch>=2.2,<3",
  "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
whisper = [
  "transformers>=4.45,<6",
  "safetensors>=0.4",
]
annotation = [
  "onnxruntime>=1.20,<2",
  "silero-vad>=6.2,<7",
]
semantic-profile = [
  "sentence-transformers>=3,<6",
  "scikit-learn>=1.4,<2",
]
qwen-hidden = [
  "transformers>=5,<6",
  "accelerate>=1.0",
  "qwen-omni-utils>=0.0.8",
  "librosa>=0.10",
]
dev = [
  "pytest>=8,<10",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
